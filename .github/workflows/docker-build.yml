name: Docker Build & Publish

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tunnd-server

jobs:
  # ── Docker multi-architecture build and push ────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Set up QEMU for cross-compilation (required for arm64 on amd64 runners)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx for multi-architecture builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata: semver tags + "latest" from the Git tag
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # Build for linux/amd64 and linux/arm64, push to ghcr.io
      # Uses GitHub Actions cache to speed up subsequent builds
      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers from/to the registry for faster builds
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ── Vulnerability scanning ──────────────────────────────────────────────────
  scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: read
      # We deliberately don't request security-events: write here. SARIF
      # upload to the Security tab needs that permission, but on a repo
      # without code scanning enabled (the default for fresh public
      # repos) the YAML alone is enough for the runner to refuse to set
      # up the job. Trivy still gates the job on HIGH/CRITICAL findings
      # via its own exit code; SARIF visualisation can be added later by
      # an operator who enables code scanning.

    steps:
      - uses: actions/checkout@v4

      # Authenticate to pull the image that was just pushed
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the image reference once; reuse below.
      - name: Resolve image reference
        id: image
        run: |
          REF="${GITHUB_REF_NAME#v}"
          echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${REF}" >> "$GITHUB_OUTPUT"

      # Scan the published image for vulnerabilities. Fails the job on
      # HIGH or CRITICAL findings (with a fix available — ignore-unfixed).
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # ── Health check verification ───────────────────────────────────────────────
  health-check:
    name: Health Check Verification
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      # Authenticate to pull the image that was just pushed
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Use the explicit semver tag for predictable pull (the metadata
      # action emits multiple tags — latest, semver, major, etc. — joined
      # by newlines, which docker pull doesn't accept).
      - name: Resolve image reference
        id: image
        run: |
          # Strip a leading 'v' from the git ref to match the {{version}}
          # template that goreleaser/docker-metadata uses.
          REF="${GITHUB_REF_NAME#v}"
          echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${REF}" >> "$GITHUB_OUTPUT"

      # Pull the amd64 image explicitly so it is available locally for docker run.
      # Retries handle the brief manifest-propagation lag right after a push.
      - name: Pull image (linux/amd64)
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull --platform linux/amd64 ${{ steps.image.outputs.ref }}; then
              exit 0
            fi
            echo "Pull attempt $attempt failed; sleeping before retry..."
            sleep $((attempt * 5))
          done
          exit 1

      # Start the container with minimal test configuration.
      # TUNND_DOMAIN and TUNND_ADMIN_PASSWORD are required by the server to
      # start. The admin port (9091) is mapped to the host so we can reach
      # /healthz and /api/stats. TUNND_DB_PATH lands inside the writable
      # /data volume so the unprivileged tunnd user can open it.
      - name: Start test container
        run: |
          docker run -d \
            --name tunnd-healthcheck-test \
            --platform linux/amd64 \
            -p 9091:9091 \
            -e TUNND_DOMAIN=test.example.com \
            -e TUNND_ADMIN_PASSWORD=testpassword12345 \
            -e TUNND_HTTP_PORT=8080 \
            -e TUNND_DB_PATH=/data/tunnd.db \
            ${{ steps.image.outputs.ref }}

      # Poll docker inspect until the container reports "healthy" or the
      # 60-second timeout is reached. Fail the job if the deadline passes.
      - name: Wait for container to become healthy
        run: |
          echo "Waiting for container to become healthy (timeout: 60s)..."
          TIMEOUT=60
          ELAPSED=0
          INTERVAL=3
          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' tunnd-healthcheck-test 2>/dev/null || echo "unknown")
            echo "Health status after ${ELAPSED}s: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy."
              exit 0
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "ERROR: Container did not become healthy within ${TIMEOUT} seconds."
          echo "--- Container logs ---"
          docker logs tunnd-healthcheck-test
          exit 1

      # Verify the /api/stats endpoint responds correctly through the
      # admin session-cookie auth flow: POST /login with the password,
      # capture the session cookie, then call /api/stats with it.
      - name: Verify admin auth + /api/stats
        run: |
          set -e
          COOKIE=$(mktemp)
          trap "rm -f $COOKIE" EXIT

          # Log in. Tunnd issues a 303 redirect with the session cookie on
          # success. -L follows it so we land on / (200).
          LOGIN_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -c "$COOKIE" -L \
            --data-urlencode "password=testpassword12345" \
            http://localhost:9091/login)
          echo "Login response: HTTP $LOGIN_HTTP"
          if [ "$LOGIN_HTTP" != "200" ]; then
            echo "ERROR: login did not return HTTP 200 (got $LOGIN_HTTP)."
            exit 1
          fi

          # Now hit the API with the session cookie.
          STATS_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -b "$COOKIE" http://localhost:9091/api/stats)
          echo "/api/stats response: HTTP $STATS_HTTP"
          if [ "$STATS_HTTP" != "200" ]; then
            echo "ERROR: /api/stats returned HTTP $STATS_HTTP, expected 200."
            exit 1
          fi
          echo "Admin login + /api/stats verified successfully."

      # Capture logs and inspect output on failure so debugging is one-click.
      - name: Capture container diagnostics on failure
        if: failure()
        run: |
          echo '--- docker inspect (state) ---'
          docker inspect --format='{{json .State}}' tunnd-healthcheck-test 2>&1 | python3 -m json.tool || true
          echo '--- docker logs ---'
          docker logs tunnd-healthcheck-test 2>&1 || true

      # Always remove the test container to keep the runner clean,
      # even if previous steps failed.
      - name: Clean up test container
        if: always()
        run: |
          docker stop tunnd-healthcheck-test || true
          docker rm tunnd-healthcheck-test || true
