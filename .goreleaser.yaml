version: 2

project_name: tunnd

before:
  hooks:
    - go mod tidy

builds:
  - id: server
    main: ./cmd/server
    binary: tunnd-server
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.CommitSHA={{.Commit}}
      - -X main.BuildDate={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  - id: client
    main: ./cmd/client
    binary: tunnd
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.CommitSHA={{.Commit}}
      - -X main.BuildDate={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: server
    ids: [server]
    name_template: "tunnd-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - configs/tunnd-server.example.yaml

  - id: client
    ids: [client]
    name_template: "tunnd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "✨ New Features"
      regexp: "^feat"
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "⚡ Performance"
      regexp: "^perf"
      order: 2
    - title: "Other Changes"
      order: 999

dockers:
  - image_templates:
      - "ghcr.io/elvonpiko/tunnd-server:{{ .Tag }}-amd64"
    ids: [server]
    dockerfile: Dockerfile.server
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"

  - image_templates:
      - "ghcr.io/elvonpiko/tunnd-server:{{ .Tag }}-arm64"
    ids: [server]
    dockerfile: Dockerfile.server
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/elvonpiko/tunnd-server:{{ .Tag }}"
    image_templates:
      - "ghcr.io/elvonpiko/tunnd-server:{{ .Tag }}-amd64"
      - "ghcr.io/elvonpiko/tunnd-server:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/elvonpiko/tunnd-server:latest"
    image_templates:
      - "ghcr.io/elvonpiko/tunnd-server:{{ .Tag }}-amd64"
      - "ghcr.io/elvonpiko/tunnd-server:{{ .Tag }}-arm64"

brews: []
# Homebrew tap for the client will be wired up post-launch once the project
# has steady-state release cadence. To add later, restore a `brews:` block
# pointing at a `homebrew-tap` repo and provide a HOMEBREW_TAP_TOKEN secret
# in CI.

release:
  github:
    owner: elvonpiko
    name: tunnd
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto
  header: |
    ## Tunnd v{{ .Version }}

    Self-hosted tunnel server — expose localhost to the internet.

    **Quick install (Linux / macOS):**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/elvonpiko/tunnd/main/install.sh | bash
    ```

    **Quick install (Windows / PowerShell):**
    ```powershell
    iwr -useb https://raw.githubusercontent.com/elvonpiko/tunnd/main/install.ps1 | iex
    ```
