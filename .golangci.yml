# golangci-lint configuration (v2 schema).
#
# The enabled set focuses on bug-finders, not style nags. The standard
# defaults already cover errcheck/govet/staticcheck/unused. We add bodyclose,
# misspell, and unconvert because they catch real issues without producing a
# wall of stylistic noise.

version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - misspell
    - unconvert
  # NOTE: noctx is a great future-state lint but requires threading
  # context.Context through the store, control plane, and tunnel registry —
  # a deliberate refactor for a later release. Reintroduce after that lands.
  exclusions:
    rules:
      # Tests are noisy by nature — close errors and inline writes are fine.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
      # CLI prints to stdout. Ignoring write errors is intentional.
      - path: cmd/
        linters:
          - errcheck
          - bodyclose
      # The admin layer writes HTML to ResponseWriter — caller already gone if
      # the write fails. Same idiom as net/http examples.
      - path: internal/admin/
        linters:
          - errcheck
      # The control plane sets read/write deadlines and closes connections in
      # cleanup paths. Errors there are not actionable.
      - path: internal/control/
        linters:
          - errcheck
      # The store closes *sql.Rows in deferred calls — the standard pattern.
      - path: internal/store/
        linters:
          - errcheck
      # The tunnel registry closes pipe readers/writers and response bodies in
      # cleanup paths — errors there mean the peer has already gone away.
      - path: internal/tunnel/
        linters:
          - errcheck
    presets:
      - common-false-positives
      - legacy

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/elvonpiko/tunnd
